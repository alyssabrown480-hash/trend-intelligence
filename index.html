<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAF Trend Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F4F6;
    --surface:#FFFFFF;
    --ink:#263444;
    --ink-soft:#5A6472;
    --ink-faint:#8B93A0;
    --line:#E4E6E9;
    --accent:#253B55;
    --accent-soft:#E4E8EE;
    --gold:#C5A16F;
    --c-emerging:#59643C;
    --c-growing:#C5A16F;
    --c-peaking:#A8462D;
    --c-steady:#59616B;
    --c-declining:#9AA0A6;
    --radius:14px;
    --radius-sm:8px;
    --shadow:0 1px 2px rgba(37,59,85,.05), 0 12px 30px rgba(37,59,85,.08);
    --shadow-sm:0 1px 2px rgba(37,59,85,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161C24; --surface:#1F2731; --ink:#EDEFF2; --ink-soft:#AEB6C0; --ink-faint:#77808C;
      --line:#2C3540; --accent:#7C93B0; --accent-soft:#25313F;
      --c-emerging:#8CA26A; --c-growing:#D4B784; --c-peaking:#D07A56; --c-steady:#8B96A3; --c-declining:#6C7580;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px rgba(0,0,0,.35);
      --shadow-sm:0 1px 2px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#161C24; --surface:#1F2731; --ink:#EDEFF2; --ink-soft:#AEB6C0; --ink-faint:#77808C;
    --line:#2C3540; --accent:#7C93B0; --accent-soft:#25313F;
    --c-emerging:#8CA26A; --c-growing:#D4B784; --c-peaking:#D07A56; --c-steady:#8B96A3; --c-declining:#6C7580;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Montserrat',sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Playfair Display',serif;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  /* ---------- Layout ---------- */
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:232px;flex:none;background:var(--surface);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    padding:28px 18px;position:sticky;top:0;height:100vh;
  }
  .brand{margin-bottom:30px;padding:0 8px;}
  .brand h1{font-size:19px;margin:0 0 2px;font-weight:600;letter-spacing:.1px;}
  .brand p{margin:0;font-size:11.5px;color:var(--ink-faint);letter-spacing:.03em;}
  .faf-logo{display:flex;align-items:center;gap:9px;}
  .faf-mark{
    font-family:'Montserrat',sans-serif;font-weight:300;font-size:21px;
    letter-spacing:.32em;color:var(--ink);line-height:1;margin-right:-.32em;
  }
  .faf-divider{width:1px;height:28px;background:var(--line);flex:none;}
  .faf-tagline{
    font-family:'Montserrat',sans-serif;font-weight:500;font-size:7.3px;
    letter-spacing:.19em;color:var(--ink-soft);line-height:1.85;white-space:nowrap;
  }

  nav{flex:1;display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;border-radius:10px;cursor:pointer;
    color:var(--ink-soft);font-size:13.4px;font-weight:500;
    border:1px solid transparent;transition:background .15s ease, color .15s ease;
    background:none;text-align:left;width:100%;
  }
  .nav-item svg{width:17px;height:17px;flex:none;opacity:.85;}
  .nav-item:hover{background:var(--bg);color:var(--ink);}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .nav-item.active svg{opacity:1;}

  .sidebar-foot{border-top:1px solid var(--line);padding-top:16px;margin-top:16px;}
  .season-pill{
    display:flex;align-items:center;justify-content:space-between;
    font-size:12px;color:var(--ink-soft);padding:9px 12px;border:1px solid var(--line);
    border-radius:10px;
  }
  .season-pill b{color:var(--ink);font-weight:600;}

  .main{flex:1;min-width:0;padding:30px 42px 60px;max-width:1200px;}

  .topbar{
    display:flex;justify-content:space-between;align-items:flex-start;
    margin-bottom:26px;gap:20px;flex-wrap:wrap;
  }
  .topbar h2{font-size:28px;margin:0 0 6px;font-weight:600;letter-spacing:.1px;}
  .topbar .sub{color:var(--ink-soft);font-size:13.6px;max-width:520px;line-height:1.55;}
  .topbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .updated{font-size:11.5px;color:var(--ink-faint);margin-right:4px;white-space:nowrap;}
  .btn{
    font-size:12.5px;font-weight:600;padding:9px 15px;border-radius:10px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .btn:hover{border-color:#C7C4BA;}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.primary:hover{background:#1B2A3D;}
  .btn svg{width:13px;height:13px;}

  section.view{display:none;animation:fade .4s ease;}
  section.view.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- Reusable pieces ---------- */
  .grid{display:grid;gap:18px;}
  .cols-4{grid-template-columns:repeat(4,1fr);}
  .cols-3{grid-template-columns:repeat(3,1fr);}
  .cols-2{grid-template-columns:2fr 1fr;}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 22px;box-shadow:var(--shadow-sm);
  }
  .card h3{
    font-family:'Montserrat',sans-serif;font-size:11.5px;font-weight:600;color:var(--ink-soft);
    margin:0 0 14px;letter-spacing:.01em;
  }
  .kpi .num{font-family:'Playfair Display',serif;font-size:31px;font-weight:600;line-height:1;}
  .kpi .label{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .kpi .delta{font-size:11.5px;margin-top:8px;color:var(--c-emerging);font-weight:600;}
  .kpi .delta.down{color:var(--c-peaking);}

  .section-block{margin-bottom:26px;}
  .section-block > .block-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
  .section-block > .block-head h3{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;color:var(--ink);margin:0;}
  .section-block > .block-head .link{font-size:12px;color:var(--accent);cursor:pointer;font-weight:600;}

  .pill{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
    padding:4px 11px 4px 8px;border-radius:20px;
  }
  .pill .dot{width:6px;height:6px;border-radius:50%;flex:none;}

  .meta-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 0 22px;}
  .meta-chip{font-size:11.5px;font-weight:600;color:var(--ink-soft);}
  .meta-sep{color:var(--ink-faint);font-size:11px;}
  .source-note{font-size:10.8px;color:var(--ink-faint);margin-top:10px;line-height:1.4;font-style:italic;}

  /* Hero banner */
  .hero{
    position:relative;border-radius:20px;overflow:hidden;margin-bottom:26px;
    min-height:190px;display:flex;align-items:flex-end;box-shadow:var(--shadow);
    background:linear-gradient(135deg,#1B2635 0%,#253B55 52%,#8A7147 100%);
  }
  .hero-pattern{position:absolute;inset:0;width:100%;height:100%;}
  .hero-pattern circle{fill:none;stroke:#F3F4F6;stroke-width:1;opacity:.16;}
  .hero-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
  .hero-overlay{position:absolute;inset:0;background:linear-gradient(90deg, rgba(20,20,20,.72) 0%, rgba(20,20,20,.38) 55%, rgba(20,20,20,.18) 100%);z-index:0;}
  .hero-content{position:relative;z-index:1;padding:28px 32px;color:#fff;}
  .hero-content .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85;margin-bottom:8px;}
  .hero-content h2{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;margin:0 0 6px;color:#fff;}
  .hero-content p{font-size:13.2px;max-width:480px;line-height:1.5;opacity:.92;margin:0;}

  .hero-carousel{touch-action:pan-y;}
  .hero-slide{
    position:absolute;inset:0;display:flex;align-items:flex-end;
    opacity:0;pointer-events:none;transition:opacity .5s ease;
  }
  .hero-slide.active{opacity:1;pointer-events:auto;z-index:1;}
  .hero-arrow{
    position:absolute;top:50%;transform:translateY(-50%);
    width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
    color:#fff;display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:2;transition:background .2s ease;
  }
  .hero-arrow:hover{background:rgba(255,255,255,.32);}
  .hero-arrow.prev{left:14px;}
  .hero-arrow.next{right:14px;}
  .hero-arrow svg{width:16px;height:16px;}
  .hero-dots{position:absolute;bottom:14px;right:20px;z-index:2;display:flex;gap:6px;}
  .hero-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer;transition:all .2s ease;}
  .hero-dot.active{background:#fff;width:18px;border-radius:4px;}

  /* Trend chip cards */
  .trend-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .trend-card{
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    background:var(--surface);box-shadow:var(--shadow-sm);transition:box-shadow .2s ease, transform .2s ease;
  }
  .trend-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
  .story-thumb{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;}
  .trend-card .photo{
    aspect-ratio:16/11;position:relative;display:flex;align-items:center;justify-content:center;
  }
  .trend-card .photo svg{width:34%;height:34%;}
  .trend-card .photo .status-pill{
    position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92);
    padding:4px 10px 4px 8px;border-radius:20px;font-size:10.5px;font-weight:600;
    display:flex;align-items:center;gap:5px;color:var(--ink);backdrop-filter:blur(2px);
  }
  .trend-card .photo .status-pill .dot{width:6px;height:6px;border-radius:50%;}
  .trend-card .body{padding:15px 17px 18px;}
  .trend-card .name{font-family:'Playfair Display',serif;font-size:16.5px;font-weight:600;margin-bottom:5px;}
  .trend-card .desc{font-size:12.3px;color:var(--ink-soft);line-height:1.5;margin-bottom:11px;min-height:36px;}
  .swatches{display:flex;gap:5px;}
  .swatches span{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.08);}

  /* Donut + legend */
  .donut-wrap{display:flex;align-items:center;gap:22px;}
  .legend{display:flex;flex-direction:column;gap:7px;flex:1;}
  .legend-row{display:flex;justify-content:space-between;font-size:12.5px;}
  .legend-row .left{display:flex;align-items:center;gap:7px;color:var(--ink-soft);}
  .legend-row .dot{width:7px;height:7px;border-radius:50%;}
  .legend-row .val{font-weight:600;color:var(--ink);}

  /* Tables */
  table{width:100%;border-collapse:collapse;font-size:12.6px;}
  th{
    text-align:left;font-weight:600;color:var(--ink-faint);font-size:11px;
    padding:0 10px 10px 0;border-bottom:1px solid var(--line);
  }
  td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .row-title{font-weight:600;display:flex;align-items:center;gap:10px;}
  .row-photo{
    width:30px;height:30px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 2px #fff, 0 0 0 3px var(--line);
  }
  .row-photo svg{width:56%;height:56%;}
  .pct.up{color:var(--c-emerging);font-weight:600;}
  .pct.down{color:var(--c-peaking);font-weight:600;}
  .dotscale{display:flex;gap:3px;}
  .dotscale span{width:6px;height:6px;border-radius:50%;background:var(--line);}
  .dotscale span.on{background:var(--accent);}

  .opp-cell{font-size:11px;font-weight:600;padding:8px 8px;border-radius:8px;text-align:center;}

  .list-rank{display:flex;flex-direction:column;}
  .list-rank .item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .list-rank .item:last-child{border-bottom:none;}
  .list-rank .name{display:flex;align-items:center;gap:10px;}
  .list-rank .idx{color:var(--ink-faint);font-size:11.5px;width:14px;}

  .insight-box{
    background:var(--accent-soft);border-radius:var(--radius);padding:19px 22px;
    font-size:13px;line-height:1.6;color:var(--ink);
  }
  .insight-box .kicker{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:8px;display:block;text-transform:uppercase;letter-spacing:.14em;}

  .bullets{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;}
  .bullets li{font-size:12.8px;line-height:1.5;padding-left:16px;position:relative;color:var(--ink);}
  .bullets li::before{content:'';position:absolute;left:0;top:6px;width:5px;height:5px;border-radius:50%;background:var(--accent);}

  /* Color swatch strip */
  .swatch-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
  .swatch-strip .chip{border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm);}
  .swatch-strip .block{height:64px;}
  .swatch-strip .meta{padding:10px 12px;}
  .swatch-strip .meta .name{font-weight:600;font-size:12.5px;margin-bottom:3px;}

  /* Material chips */
  .mat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .mat-chip{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow-sm);}
  .mat-chip .photo{height:78px;display:flex;align-items:center;justify-content:center;}
  .mat-chip .photo svg{width:32%;height:32%;}
  .mat-chip .icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:14px 0 0 14px;}
  .mat-chip .icon svg{width:55%;height:55%;}
  .mat-chip .txt{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;}
  .mat-chip .name{font-weight:600;font-size:12.8px;}

  /* Timing guide */
  .timing-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .timing-col{border:1px solid var(--line);border-radius:var(--radius);padding:19px;background:var(--surface);box-shadow:var(--shadow-sm);}
  .timing-col .head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .timing-col .head .dot{width:8px;height:8px;border-radius:50%;}
  .timing-col .head h4{font-family:'Playfair Display',serif;font-size:16.5px;margin:0;font-weight:600;}
  .timing-col .window{font-size:11px;color:var(--ink-faint);margin-bottom:4px;}
  .timing-col .confidence{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:14px;}
  .timing-item{padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;}
  .timing-item:first-of-type{border-top:none;padding-top:6px;}
  .t-photo{
    width:44px;height:44px;border-radius:10px;flex:none;
    display:flex;align-items:center;justify-content:center;
    transition:filter .3s ease;
  }
  .t-photo svg{width:52%;height:52%;}
  .t-photo.grain-mid{filter:grayscale(45%) saturate(80%) brightness(1.02);}
  .t-photo.grain-far{filter:grayscale(85%) saturate(35%) brightness(1.05);}
  .timing-item .t-name{font-weight:600;font-size:13px;margin-bottom:2px;}
  .timing-item .t-desc{font-size:12px;color:var(--ink-soft);line-height:1.45;}
  .why{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:11.6px;color:var(--ink-soft);line-height:1.5;}

  /* Sentiment bar */
  .sentiment-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:10px 0 8px;}
  .sentiment-legend{display:flex;gap:16px;font-size:11.5px;color:var(--ink-soft);}
  .sentiment-legend .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;
    font-size:12.5px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.18);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Story modal */
  .story-clickable{cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;}
  .story-clickable:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(60,40,20,.12);}
  .story-clickable .tap-hint{font-size:11px;color:var(--accent);font-weight:600;margin-top:10px;display:flex;align-items:center;gap:4px;}
  .story-modal-overlay{
    position:fixed;inset:0;background:rgba(20,15,10,.45);backdrop-filter:blur(2px);
    display:none;align-items:flex-start;justify-content:center;z-index:100;padding:5vh 20px;overflow-y:auto;
  }
  .story-modal-overlay.show{display:flex;}
  .story-modal{
    background:var(--surface);border-radius:20px;max-width:640px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.3);padding:30px 32px 32px;position:relative;
    animation:modalIn .25s ease;
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .story-modal .close-btn{
    position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:50%;
    border:1px solid var(--line);background:var(--bg);color:var(--ink-soft);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;
  }
  .story-modal .close-btn:hover{color:var(--ink);}
  .story-modal .m-hero-img{width:calc(100% + 64px);margin:-30px -32px 18px;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:20px 20px 0 0;}
  .story-modal .m-photo{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .story-modal .m-photo svg{width:28px;height:28px;}
  .story-modal h3.m-title{font-family:'Playfair Display',serif;font-size:23px;font-weight:600;margin:0 0 8px;padding-right:30px;}
  .story-modal .m-hook{font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:18px;}
  .story-modal .m-facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px;}
  .story-modal .m-fact{background:var(--bg);border-radius:10px;padding:10px 12px;}
  .story-modal .m-fact .k{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
  .story-modal .m-fact .v{font-size:12.5px;font-weight:600;}
  .story-modal .m-key-head{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;margin:0 0 12px;}
  .key-items-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .key-item-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);}
  .key-item-card .ki-photo{
    aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  }
  .key-item-card .ki-photo svg{width:34%;height:34%;}
  .key-item-card .ki-title{font-size:11.8px;font-weight:600;padding:9px 10px;line-height:1.35;}
  @media (max-width:560px){
    .story-modal .m-facts{grid-template-columns:1fr;}
    .key-items-grid{grid-template-columns:repeat(2,1fr);}
  }

  /* Trend Radar filters + rows */
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .playbook-card{transition:opacity .2s ease;}
  .pb-tiers{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .pb-tier{background:var(--bg);border-radius:12px;padding:12px 13px;}
  .pb-tier-ten{background:var(--accent-soft);}
  .pb-price{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--accent);margin-bottom:5px;}
  .pb-hero{font-size:12.6px;font-weight:600;line-height:1.35;margin-bottom:5px;}
  .pb-formula{font-size:11px;color:var(--ink-soft);line-height:1.4;}
  .pb-callout{
    margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--ink);color:var(--surface);
    font-family:'Playfair Display',serif;font-style:italic;font-size:13px;text-align:center;
  }
  @media (max-width:560px){ .pb-tiers{grid-template-columns:1fr;} }
  .filter-chip{
    font-size:12px;font-weight:600;padding:7px 13px;border-radius:20px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-soft);cursor:pointer;transition:all .15s ease;
  }
  .filter-chip span{color:var(--ink-faint);font-weight:500;}
  .filter-chip:hover{border-color:#D8CBB6;}
  .filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .filter-chip.active span{color:rgba(255,255,255,.65);}
  .radar-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;}
  .radar-row{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line);}
  .radar-row:last-child{border-bottom:none;}
  .radar-photo{width:46px;height:46px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;}
  .radar-photo svg{width:52%;height:52%;}
  .radar-mid{flex:1;min-width:0;}
  .radar-name{font-weight:600;font-size:13.5px;margin-bottom:2px;}
  .radar-desc{font-size:12px;color:var(--ink-soft);line-height:1.4;max-width:440px;}
  .radar-cat{font-size:11.5px;color:var(--ink-faint);width:140px;flex:none;}
  .radar-status{width:110px;flex:none;}

  /* Micro trend drops */
  .micro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .micro-chip{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow-sm);}
  .micro-photo{height:86px;display:flex;align-items:center;justify-content:center;position:relative;}
  .micro-photo svg{width:36%;height:36%;}
  .micro-badge{
    position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-size:9.5px;font-weight:700;
    padding:3px 8px;border-radius:20px;letter-spacing:.02em;
  }
  .micro-txt{padding:11px 12px 13px;}
  .micro-name{font-weight:600;font-size:12.5px;margin-bottom:4px;}
  .micro-desc{font-size:11.5px;color:var(--ink-soft);line-height:1.45;}

  /* Resources */
  .resource-list{display:flex;flex-direction:column;}
  .resource-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);}
  .resource-row:last-child{border-bottom:none;}
  .resource-icon{
    width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .resource-icon svg{width:18px;height:18px;}
  .resource-mid{flex:1;}
  .resource-name{font-weight:600;font-size:13.5px;}
  .resource-meta{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
  .resource-btn{padding:7px 14px;font-size:12px;}

  @media(max-width:980px){
    .sidebar{display:none;}
    .main{padding:22px;}
    .grid.cols-4,.grid.cols-3,.trend-grid,.mat-grid,.swatch-strip,.micro-grid{grid-template-columns:repeat(2,1fr);}
    .grid.cols-2,.timing-cols{grid-template-columns:1fr;}
  }
</style>
</head>

}

function donut(segments, size, thickness){
  size = size||118; thickness = thickness||15;
  const total = segments.reduce((a,s)=>a+s.value,0);
  const r = (size - thickness)/2, c = size/2;
  const circ = 2*Math.PI*r;
  let cum = 0;
  const circles = segments.map(seg=>{
    const dash = (seg.value/total)*circ;
    const el = `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${thickness}"
      stroke-dasharray="${dash.toFixed(2)} ${(circ-dash).toFixed(2)}" stroke-dashoffset="${(-cum).toFixed(2)}" stroke-linecap="round"/>`;
    cum += dash;
    return el;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="transform:rotate(-90deg)">${circles}</svg>`;
}

function sparkline(values, w, h){
  w=w||280; h=h||90;
  const pad=10;
  const max=Math.max(...values), min=Math.min(...values);
  const range=(max-min)||1;
  const stepX=(w-2*pad)/(values.length-1);
  const pts=values.map((v,i)=>[pad+i*stepX, h-pad-((v-min)/range)*(h-2*pad)]);
  const d=pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.8" fill="var(--accent)"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>${dots}
  </svg>`;
}

function dotScale(n, of){
  of = of||5;
  let s='<div class="dotscale">';
  for(let i=0;i<of;i++) s+=`<span class="${i<n?'on':''}"></span>`;
  return s+'</div>';
}

  return `
    <div class="hero">

function heroCarousel(slides){

      </svg>
      ${slides.map((s,i)=>`
        <div class="hero-slide ${i===0?'active':''}">
          ${s.img ? `<img class="hero-bg-img" src="${s.img}" style="object-position:${s.focal||'50% 50%'}" onerror="this.remove()" alt="">` : ''}
          ${s.img ? '<div class="hero-overlay"></div>' : ''}
          <div class="hero-content">
            <div class="eyebrow">${s.eyebrow}</div>
            <h2>${s.title}</h2>

          </div>
        </div>`).join('')}
      <button class="hero-arrow prev" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>

      <button class="hero-arrow next" aria-label="Next">

      </button>
      <div class="hero-dots">
        ${slides.map((_,i)=>`<span class="hero-dot ${i===0?'active':''}"></span>`).join('')}

function renderRadar(){
  const counts = {all: trends.length};
  Object.keys(STATUS).forEach(s => counts[s] = trends.filter(t=>t.status===s).length);
  const chips = [['all','All'], ...Object.entries(STATUS).map(([k,v])=>[k,v.label])];
  return `
    <div class="section-block">
      ${metaRow(['16 trends tracked','5 momentum stages','Filter by status below'])}
      <div class="filter-row">
        ${chips.map(([key,label])=>`<button class="filter-chip ${key==='all'?'active':''}" data-filter="${key}">${label} <span>${counts[key]||0}</span></button>`).join('')}
      </div>
      <div class="radar-list" id="radar-list">
        ${trends.map(t=>`
          <div class="radar-row" data-status="${t.status}">
            <div class="radar-photo" style="background:${HEX[t.status]}17;color:${HEX[t.status]}">${markIcon(t.mark)}</div>

            <div class="radar-status">${tag(t.status)}</div>

  b.dataset.tab = s.id;
  b.innerHTML = navIcon(s.icon) + s.label;
  b.onclick = () => go(s.id);
  navEl.appendChild(b);

  const sec = document.createElement('section');
  sec.className = 'view';
  sec.id = 'view-'+s.id;
  viewsEl.appendChild(sec);
});

function fmtDate(d){
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) + ' \u00b7 ' +
    d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

let lastUpdated = new Date();

function go(id){
  const s = SECTIONS.find(x=>x.id===id);
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.tab===id));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const target = document.getElementById('view-'+id);
  if(!target.dataset.built){
    target.innerHTML = s.render();
    target.dataset.built = '1';
    const heroCarouselEl = target.querySelector('.hero-carousel');
    if(heroCarouselEl) initHeroCarousel(heroCarouselEl);
    target.querySelectorAll('[data-tab]').forEach(el=>{
      if(el.classList.contains('link')) el.addEventListener('click', ()=>go(el.dataset.tab));
    });
    target.querySelectorAll('.filter-chip[data-filter]').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        target.querySelectorAll('.filter-chip[data-filter]').forEach(c=>c.classList.remove('active'));
        chip.classList.add('active');
        const f = chip.dataset.filter;
        target.querySelectorAll('.radar-row').forEach(row=>{
          row.style.display = (f==='all' || row.dataset.status===f) ? '' : 'none';
        });
      });
    });
    target.querySelectorAll('.filter-chip[data-pb-filter]').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        target.querySelectorAll('.filter-chip[data-pb-filter]').forEach(c=>c.classList.remove('active'));
        chip.classList.add('active');
        const f = chip.dataset.pbFilter;
        target.querySelectorAll('.playbook-card').forEach(card=>{
          card.style.display = (f==='all' || card.dataset.pbSeason===f) ? '' : 'none';
        });
      });
    });
  }
  target.classList.add('active');
  document.getElementById('view-title').textContent = s.title;
  document.getElementById('view-sub').textContent = s.sub;
  window.scrollTo({top:0});
}

document.getElementById('updated-label').textContent = 'Updated ' + fmtDate(lastUpdated);

function initHeroCarousel(root){
  const slides = Array.from(root.querySelectorAll('.hero-slide'));
  const dots = Array.from(root.querySelectorAll('.hero-dot'));
  if(!slides.length) return;
  let idx = 0, timer = null;
  function show(i){
    idx = (i + slides.length) % slides.length;
    slides.forEach((s,n)=>s.classList.toggle('active', n===idx));
    dots.forEach((d,n)=>d.classList.toggle('active', n===idx));
  }
  function next(){ show(idx+1); }
  function prev(){ show(idx-1); }
  function restart(){ clearInterval(timer); timer = setInterval(next, 6000); }
  root.querySelector('.hero-arrow.prev')?.addEventListener('click', ()=>{ prev(); restart(); });
  root.querySelector('.hero-arrow.next')?.addEventListener('click', ()=>{ next(); restart(); });
  dots.forEach((d,n)=> d.addEventListener('click', ()=>{ show(n); restart(); }));
  let touchStartX = null;
  root.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
  root.addEventListener('touchend', e=>{
    if(touchStartX===null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40){ dx < 0 ? next() : prev(); restart(); }
    touchStartX = null;
  }, {passive:true});
  root.addEventListener('mouseenter', ()=>clearInterval(timer));
  root.addEventListener('mouseleave', restart);
  restart();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function openStoryModal(id){
  const s = stories.find(x=>x.id===id);
  if(!s) return;
  const modal = document.getElementById('story-modal');
  modal.innerHTML = `
    <button class="close-btn" onclick="closeStoryModal()">&times;</button>
    <img class="m-hero-img" src="${s.img}" style="object-position:${s.focal||'50% 50%'}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt="${s.name}">
    <div class="m-photo" style="display:none;background:${HEX[s.status]}17;color:${HEX[s.status]}">${markIcon(s.mark)}</div>
    <h3 class="m-title">${s.name}</h3>
    <div style="font-family:'Playfair Display',serif;font-style:italic;font-size:14.5px;color:var(--accent);margin:-4px 0 10px">\u201c${s.hook}\u201d</div>
    <div style="margin-bottom:12px">${tag(s.status)}</div>
    <div class="m-hook">${s.narrative}</div>
    <div class="m-facts">
      ${s.facts.map(([k,v])=>`<div class="m-fact"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}
    </div>
    <div class="m-key-head">Key items</div>
    <div class="key-items-grid">
      ${(s.keyItems||[]).map(k=>`
        <div class="key-item-card">
          <div class="ki-photo" style="background:${HEX[s.status]}17;color:${HEX[s.status]}">${markIcon(k.mark)}</div>
          <div class="ki-title">${k.name}</div>
        </div>`).join('')}
    </div>
    <div class="m-key-head" style="margin-top:20px">Motifs & details</div>
    <div style="font-size:12.6px;color:var(--ink-soft);line-height:1.6;margin-bottom:16px">${s.motifs}</div>
    <div class="m-facts" style="margin-bottom:0">
      <div class="m-fact" style="background:var(--accent-soft)">
        <div class="k" style="color:var(--accent)">Creative direction</div>
        <div class="v" style="font-weight:500;line-height:1.5">${s.creative}</div>
      </div>
      <div class="m-fact">
        <div class="k">Avoid</div>
        <div class="v" style="font-weight:500;line-height:1.5">${s.avoid}</div>
      </div>
    </div>
    <div class="m-key-head" style="margin-top:20px">Merchandising moment</div>
    <div style="font-size:12.6px;color:var(--ink-soft);line-height:1.6">${s.merch}</div>
  `;
  document.getElementById('story-modal-overlay').classList.add('show');
}

function closeStoryModal(){
  document.getElementById('story-modal-overlay').classList.remove('show');
}

document.getElementById('story-modal-overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'story-modal-overlay') closeStoryModal();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeStoryModal();
});

document.getElementById('refresh-btn').addEventListener('click', ()=>{
  lastUpdated = new Date();
  document.getElementById('updated-label').textContent = 'Updated ' + fmtDate(lastUpdated);
  showToast('Trend data refreshed');
});
document.getElementById('share-btn').addEventListener('click', async ()=>{
  try{
    await navigator.clipboard.writeText(window.location.href);
    showToast('Live link copied to clipboard');
  }catch(e){
    showToast('Copy this page\u2019s URL from your browser to share');
  }
});
document.getElementById('download-btn').addEventListener('click', ()=>window.print());

go('overview');
</script>
</body>
